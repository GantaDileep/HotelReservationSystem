# Application Name
spring.application.name=HotelReservationSystem

# Server Configuration
server.port=8080

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

management.endpoint.health.show-details=always

# Metrics Configuration
management.metrics.enable.jvm=true

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hotel_reservation_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP Connection Pool
spring.datasource.hikari.pool-name=HotelReservationPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.profiles.active=dev

# File Upload Configuration
file.upload-dir=uploads/room-images
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB